      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Early Theme Detection to prevent theme flash (FOUC) -->
    <script>
      (function () {
        try {
          const storedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-brand-bg dark:bg-brand-dark-bg text-brand-text dark:text-brand-dark-text antialiased selection:bg-brand-purple-light selection:text-brand-purple min-h-screen transition-colors duration-200">
